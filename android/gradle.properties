org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true

# F131: the one place the app's identity and web origin are set.
#
# appId is PERMANENT once the first build is uploaded to Google Play -- it can never be changed
# afterwards. Confirm it (it should match the custom domain, reversed) before that first upload.
appId=com.examprepai.app
# The web app this shell opens. Switch to the custom domain before the first Play upload: the
# app is bound to this host through /.well-known/assetlinks.json.
hostName=examprep-ai-tau.vercel.app
# Bump versionCode by 1 for every Play upload; versionName is what users see.
versionCode=1
versionName=1.0.0

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f4ec" />
    <title>You're offline · PrepPlan</title>
    <style>
      /* F131: shown by public/sw.js when a page is opened with no network. Self-contained on
         purpose -- no app CSS, fonts or scripts, because none of them can load offline. */
      :root {
        --bg: #f8f4ec;
        --card: #ffffff;
        --fg: #26304a;
        --muted: #5d6680;
        --primary: #3d63a8;
        --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1d27;
          --card: #252a38;
          --fg: #f1eee7;
          --muted: #a9b0c2;
          --primary: #9dbbef;
          --on-primary: #14213d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.08);
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        min-height: 44px;
        width: 100%;
        background: var(--primary);
        color: var(--on-primary);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        PrepPlan needs the internet to load papers and save answers. Anything you already
        saved is safe. Check your Wi-Fi or mobile data and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself as soon as the connection does.
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
